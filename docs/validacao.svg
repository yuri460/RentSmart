<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 290" width="470" height="290" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <title>Rotina de leitura com validação</title>
  <defs>
    <marker id="seta2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .term{fill:#0b4f8a}
      .term-t{fill:#ffffff;font-weight:600}
      .io{fill:#e3f0fd;stroke:#2563a8;stroke-width:1.6}
      .dec{fill:#fff4d6;stroke:#b7791f;stroke-width:1.6}
      .t{font-size:15px;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
      .lbl{font-size:13px;fill:#334155;font-weight:700;dominant-baseline:central}
      .ln{fill:none;stroke:#334155;stroke-width:1.6}
      .arr{marker-end:url(#seta2)}
    </style>
  </defs>
  <rect width="470" height="290" fill="#ffffff"/>

  <rect x="60" y="8" width="180" height="36" rx="18" class="term"/>
  <text x="150" y="26" class="t term-t">Início da leitura</text>
  <line x1="150" y1="44" x2="150" y2="64" class="ln arr"/>

  <polygon points="34,64 280,64 266,106 20,106" class="io"/>
  <text x="150" y="85" class="t">Exibir pergunta e ler resposta</text>
  <line x1="150" y1="106" x2="150" y2="128" class="ln arr"/>

  <polygon points="150,128 250,165 150,202 50,165" class="dec"/>
  <text x="150" y="165" class="t">Resposta válida?</text>

  <line x1="250" y1="165" x2="300" y2="165" class="ln arr"/>
  <text x="275" y="152" class="lbl" text-anchor="middle">Não</text>

  <polygon points="314,137 456,137 442,193 300,193" class="io"/>
  <text x="378" y="155" class="t">Exibir aviso [!]</text>
  <text x="378" y="176" class="t">com o motivo</text>
  <polyline points="378,137 378,85 275,85" class="ln arr"/>

  <line x1="150" y1="202" x2="150" y2="234" class="ln arr"/>
  <text x="158" y="218" class="lbl">Sim</text>

  <rect x="30" y="234" width="240" height="40" rx="20" class="term"/>
  <text x="150" y="254" class="t term-t">Devolver valor convertido</text>
</svg>
